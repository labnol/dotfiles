# Settings for running Claude Code inside tmux.

# Send modified keys such as Shift+Enter to apps, so Shift+Enter adds a new
# line in Claude Code instead of submitting the prompt.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let apps send escape sequences straight to the outer terminal. Claude Code
# uses this for desktop notifications and its progress indicator.
set -g allow-passthrough on

# Let apps inside tmux copy to the system clipboard.
set -s set-clipboard on

# Tell apps when their pane gains or loses focus.
set -g focus-events on

# 24-bit color, so themes look the same as they do outside tmux.
set -as terminal-features ',*:RGB'

# Keep 50,000 lines of scrollback per pane (the default is 2,000).
set -g history-limit 50000

# Number windows from 1 instead of 0, to match the keyboard's number row.
set -g base-index 1
set -g pane-base-index 1

# Put the status bar at the top, away from Claude Code's own status line.
set -g status-position top

# Dark grey status bar with light grey text, in place of the default green.
set -g status-style 'bg=colour236,fg=colour248'

# Show the current window in bold white.
set -g window-status-current-style 'fg=white,bold'

# Grey pane borders in place of the default green: light grey around the
# active pane, dark grey around the others.
set -g pane-active-border-style 'fg=colour248'
set -g pane-border-style 'fg=colour238'

# Name each window by its title, then its folder. Claude Code's command is only
# a version number, while its title is the name of the session. Shell windows
# show the folder alone, because their title is already the path.
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},,#{=40:pane_title} · }#{b:pane_current_path}'

# Draw the folder in a dimmer grey than the title, so the title stands out.
# A window that rang the bell keeps one colour, because grey is hard to read
# on red.
set -g window-status-format '#I:#{?#{==:#{pane_current_command},zsh},,#{=40:pane_title} #{?window_bell_flag,,#[fg=colour244]}· }#{b:pane_current_path}#[default]#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{?#{==:#{pane_current_command},zsh},,#{=40:pane_title} #[fg=colour248]#[nobold]· }#{b:pane_current_path}#[default]#{?window_flags,#{window_flags}, }'

# Show a window in red when it rings the bell, which Claude Code does when it
# is waiting for you.
set -g window-status-bell-style 'bg=red,fg=white,bold'

# The title is now in the window list, so the right side only shows the time.
set -g status-right '%H:%M'

# Turn the session name orange after the prefix is pressed, to show that the
# next key goes to tmux and not to the app in the pane.
set -g status-left '#{?client_prefix,#[bg=colour214]#[fg=black],}[#S]#[default] '

# Open new windows and splits in the current pane's folder instead of the
# folder tmux was started in.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with prefix + h, j, k or l (left, down, up, right).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between panes with Option + arrow keys, without the prefix.
# Ghostty sends Option+Left and Option+Right as Esc+b and Esc+f.
bind -n M-b select-pane -L
bind -n M-f select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Prefix + r reloads this file.
bind r source-file ~/.tmux.conf \; display 'Config reloaded'

# Prefix + s opens a fuzzy list of tmux sessions and recent folders in a popup.
# Pick one to switch to its session; sesh creates the session if it's new.
bind s run-shell "sesh connect \"$(sesh list | fzf-tmux -p 80%,70%)\""

# Plugins, installed by TPM (https://github.com/tmux-plugins/tpm).
# tmux-resurrect saves sessions, windows, panes and their folders.
# tmux-continuum saves every 15 minutes and restores them when tmux starts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Load the plugins. This line must stay at the bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
